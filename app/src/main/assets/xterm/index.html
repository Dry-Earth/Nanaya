<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="stylesheet" href="xterm.css">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: transparent;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  #term {
    position: absolute;
    inset: 0;
    padding: 4px 2px;
    box-sizing: border-box;
    touch-action: none;
  }
  .xterm .xterm-viewport {
    background: transparent !important;
    scrollbar-width: none;
  }
  .xterm .xterm-screen {
    background: transparent;
  }
  .xterm .xterm-helper-textarea {
    font-size: 16px !important;
  }
</style>
</head>
<body>
<div id="term"></div>
<script src="xterm.js"></script>
<script src="addon-fit.js"></script>
<script src="addon-serialize.js"></script>
<script>
(function () {
  var term = new Terminal({
    cursorBlink: true,
    cursorStyle: "block",
    fontFamily: "monospace",
    fontSize: 12,
    lineHeight: 1.15,
    scrollback: 2000,
    scrollOnUserInput: true,
    allowProposedApi: true,
    theme: {
      background: "rgba(8,10,14,0.58)",
      foreground: "#E5E7EB",
      cursor: "#67E8F9",
      selectionBackground: "#33415588",
      black: "#1F2937",
      red: "#F87171",
      green: "#6EE7B7",
      yellow: "#FBBF24",
      blue: "#60A5FA",
      magenta: "#E879F9",
      cyan: "#67E8F9",
      white: "#E5E7EB",
      brightBlack: "#6B7280",
      brightRed: "#FCA5A5",
      brightGreen: "#A7F3D0",
      brightYellow: "#FDE68A",
      brightBlue: "#93C5FD",
      brightMagenta: "#F0ABFC",
      brightCyan: "#A5F3FC",
      brightWhite: "#FFFFFF"
    }
  });
  var fit = new FitAddon.FitAddon();
  var serialize = new SerializeAddon.SerializeAddon();
  term.loadAddon(fit);
  term.loadAddon(serialize);
  var termEl = document.getElementById("term");
  term.open(termEl);

  function doFit() {
    try {
      fit.fit();
      term.scrollToBottom();
    } catch (e) {}
  }
  requestAnimationFrame(doFit);
  setTimeout(doFit, 200);
  setTimeout(doFit, 700);
  window.addEventListener("resize", doFit);
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", doFit);
  }
  if (window.ResizeObserver) {
    try { new ResizeObserver(doFit).observe(termEl); } catch (e) {}
  }

  function bytesFromB64(b64) {
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }

  function b64FromBytes(bytes) {
    var bin = "";
    var step = 8192;
    for (var i = 0; i < bytes.length; i += step) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + step));
    }
    return btoa(bin);
  }

  function b64FromText(text) {
    return b64FromBytes(new TextEncoder().encode(text));
  }

  function textFromB64(b64) {
    return new TextDecoder().decode(bytesFromB64(b64));
  }

  // Xterm processes one chunk at a time. Feeding it a queue keeps a burst of
  // output (htop, yes, cat of a big log) from building a multi-megabyte write
  // buffer inside xterm and freezing the WebView.
  var writeQueue = [];
  var writeBusy = false;

  function pumpWrites() {
    if (!writeQueue.length) {
      writeBusy = false;
      return;
    }
    writeBusy = true;
    var chunk = writeQueue.shift();
    term.write(chunk, function () {
      try { AndroidBridge.ack(); } catch (e) {}
      setTimeout(pumpWrites, 0);
    });
  }

  function queueWrite(bytes) {
    writeQueue.push(bytes);
    if (!writeBusy) pumpWrites();
  }

  term.onData(function (data) {
    try {
      AndroidBridge.send(b64FromText(data));
    } catch (e) {}
  });

  term.onResize(function (size) {
    try { AndroidBridge.resize(size.cols, size.rows); } catch (e) {}
  });

  window.xtermWrite = function (b64) { queueWrite(bytesFromB64(b64)); };
  window.xtermReset = function () {
    var dropped = writeQueue.length;
    writeQueue.length = 0;
    for (var i = 0; i < dropped; i++) {
      try { AndroidBridge.ack(); } catch (e) {}
    }
    term.reset();
    doFit();
  };
  window.xtermFocus = function () {
    try {
      term.blur();
      setTimeout(function () { try { term.focus(); } catch (e) {} }, 30);
    } catch (e) {}
  };
  window.xtermScroll = function (pages) {
    try { term.scrollPages(pages); } catch (e) {}
  };
  window.xtermTop = function () { try { term.scrollToTop(); } catch (e) {} };
  window.xtermBottom = function () { try { term.scrollToBottom(); } catch (e) {} };

  window.xtermPaste = function (b64) {
    try {
      term.paste(textFromB64(b64));
      term.focus();
    } catch (e) {}
  };

  function bufferText() {
    var b = term.buffer.active;
    var from = Math.max(0, b.length - 500);
    var lines = [];
    for (var i = from; i < b.length; i++) {
      var line = b.getLine(i);
      lines.push(line ? line.translateToString(true) : "");
    }
    return lines.join("\n").replace(/\s+$/, "");
  }

  window.xtermCopy = function () {
    var text = "";
    try { text = term.getSelection(); } catch (e) {}
    if (!text) text = bufferText();
    if (!text) return;
    try { AndroidBridge.copyB64(b64FromText(text)); } catch (e) {}
  };

  // xterm.js has no touch scrolling or touch selection, so translate swipes
  // into scrollLines. Tapping still focuses the hidden textarea.
  var lastTouchY = 0;
  var touching = false;
  termEl.addEventListener("touchstart", function (e) {
    if (e.touches.length !== 1) return;
    lastTouchY = e.touches[0].clientY;
    touching = true;
  }, { passive: true });
  termEl.addEventListener("touchmove", function (e) {
    if (!touching || e.touches.length !== 1) return;
    var screen = termEl.querySelector(".xterm-screen");
    if (!screen || term.rows <= 0) return;
    var cell = Math.max(1, screen.clientHeight / term.rows);
    var dy = lastTouchY - e.touches[0].clientY;
    var lines = Math.trunc(dy / cell);
    if (lines !== 0) {
      try { term.scrollLines(lines); } catch (err) {}
      lastTouchY -= lines * cell;
    }
    e.preventDefault();
  }, { passive: false });
  termEl.addEventListener("touchend", function () { touching = false; }, { passive: true });
  termEl.addEventListener("touchcancel", function () { touching = false; }, { passive: true });

  try { AndroidBridge.ready(); } catch (e) {}
})();
</script>
</body>
</html>
